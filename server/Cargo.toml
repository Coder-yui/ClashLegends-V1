[package]
name = "clash-lobby"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.11"
rand = "0.9"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
tower-http = { version = "0.6", features = ["fs"] }

clash-battle-core = { path = "../battle-core" }

[dev-dependencies]
clash-battle-core = { path = "../battle-core", features = ["scenario-fixtures"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.11"
